name: Build and Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools build wheel

      - name: Build Debian Package
        run: |
          chmod +x scripts/build_deb.sh
          ./scripts/build_deb.sh

      - name: Install built package
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt6 python3-dbus pulseaudio-utils libnotify-bin xvfb libxcb-cursor0
          sudo dpkg -i hydrateme_*.deb || sudo apt-get install -f -y

      - name: Verify package installation (Smoke Test)
        run: |
          xvfb-run hydrateme --verify

  build_snap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build Snap Package
        run: snapcraft pack --destructive-mode

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: hydrateme-snap
          path: hydrateme_*.snap
