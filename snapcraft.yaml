name: hydrateme
base: core24
version: '1.5.3'
title: HydrateMe
contact: mailto:karankumarsacher@gmail.com
website: https://github.com/devflow-karan/hydrateme
source-code: https://github.com/devflow-karan/hydrateme
issues: https://github.com/devflow-karan/hydrateme/issues
license: MIT
summary: A simple desktop app to remind you to drink water
icon: snap/gui/icon.png
platforms:
  amd64:
  arm64:
description: |
  HydrateMe runs in your system tray and periodically reminds you 
  to drink water. Uses custom looping audio until you hydrate!
grade: stable
confinement: strict

apps:
  hydrateme:
    command: usr/bin/hydrateme
    extensions: [gnome]
    plugs: [x11, wayland, audio-playback, desktop, desktop-legacy, home, unity7]
    desktop: usr/share/applications/hydrateme.desktop
    autostart: hydrateme-autostart.desktop

parts:
  hydrateme:
    plugin: python
    source: .
    python-packages:
      - PyQt6
      - dbus-python
    build-packages:
      - libdbus-1-dev
      - pkg-config
      - python3-dev
      - gcc
      - libglib2.0-dev
      - libgirepository1.0-dev
    stage-packages:
      - libnotify-bin
      - pulseaudio-utils
      - libxkbcommon0
      - libegl1
      - libgl1
      - libfontconfig1
      - libx11-6
      - libdbus-1-3
      - libglib2.0-0
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-render-util0
      - libxcb-xinerama0
      - libxcb-shape0
      - libxcb-xfixes0
  desktop-entry:
    plugin: dump
    source: .
    organize:
      usr/share/applications/hydrateme.desktop: usr/share/applications/hydrateme.desktop
      usr/share/applications/hydrateme-autostart.desktop: usr/share/applications/hydrateme-autostart.desktop
    stage:
      - usr/share/applications/hydrateme.desktop
      - usr/share/applications/hydrateme-autostart.desktop
      - usr/share/icons/hicolor/*/apps/hydrateme.png
      - usr/share/icons/hicolor/scalable/apps/hydrateme.svg
      - usr/share/sounds/paani.wav
      - usr/bin/hydrateme
      - usr/share/hydrateme/main.py
